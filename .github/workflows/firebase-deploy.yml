name: Deployer les regles Firebase
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deployer les regles Realtime Database
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          printf '%s' "$FIREBASE_SA" > sa.json
          npx --yes firebase-tools@latest deploy --only database --project je-livre-509fd --non-interactive
          rm -f sa.json
