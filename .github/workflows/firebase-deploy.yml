
name: Deployer les regles Firebase

# Etape 1 : declenchement MANUEL seulement (bouton "Run workflow" dans l'onglet Actions).
# Quand vous avez verifie que les regles du depot sont identiques a celles de la console Firebase,
# remplacez le bloc "on:" ci-dessous par le bloc commente (lignes avec #) pour un deploiement
# automatique a chaque modification des regles.
on:
  workflow_dispatch:
#on:
#  push:
#    branches: [main]
#    paths:
#      - 'database.rules.json'
#      - 'firebase.json'
#  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deployer les regles Realtime Database
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          printf '%s' "$FIREBASE_SA" > sa.json
          npx --yes firebase-tools@latest deploy --only database --project je-livre-509fd --non-interactive
          rm -f sa.json
